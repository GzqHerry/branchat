<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>branchat · Codex</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><script defer src="/lucide.js"></script><script type="module" src="/app.js"></script></head>
<body>
<header><button id="toggle" class="icon" aria-label="收起侧边栏" title="收起侧边栏"><i data-lucide="panel-left-close"></i></button><strong>branchat</strong><button id="connection-open" class="local" aria-label="管理本机与 SSH 连接" title="管理本机与 SSH 连接" aria-haspopup="dialog"><span id="dot"></span><span id="connection">连接中</span><i data-lucide="chevron-down"></i></button><button id="refresh" class="icon" title="刷新对话" aria-label="刷新对话"><i data-lucide="refresh-cw"></i></button><button id="appearance" class="icon" title="外观设置" aria-label="外观设置"><i data-lucide="settings-2"></i></button></header>
<div id="notice" role="alert" hidden></div>
<div id="branch-toast" role="status" hidden><span id="branch-toast-text"></span><button id="undo-delete"><i data-lucide="undo-2"></i>撤销删除</button><button class="icon" id="dismiss-delete" title="关闭提示" aria-label="关闭删除提示"><i data-lucide="x"></i></button></div>
<main id="layout">
<aside id="sidebar">
<div class="source"><div class="source-heading"><span>对话</span><button id="new-chat" class="icon" title="新建对话" aria-label="新建对话"><i data-lucide="square-pen"></i></button></div><button id="conversation" aria-label="选择对话" aria-haspopup="dialog"><i data-lucide="messages-square"></i><span id="conversation-label">正在读取…</span><i data-lucide="chevrons-up-down"></i></button><div class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="搜索提问" aria-label="搜索提问"></div><div class="tree-meta"><span id="count">提问</span><span id="source-kind">Codex IDE</span></div></div>
<nav id="tree" aria-label="提问树"></nav>
<footer id="tree-footer"><i data-lucide="git-branch"></i><span id="branch-count">0 个分支</span></footer>
<div id="sidebar-resizer" role="separator" tabindex="0" aria-label="调整侧栏宽度" aria-orientation="vertical" aria-controls="sidebar" title="拖动调整侧栏宽度，双击恢复默认"></div>
</aside>
<section id="chat">
<div class="chat-head"><div><div class="eyebrow" id="branch-type">原对话</div><h1 id="branch-name">选择一个对话</h1></div><button class="icon" id="rename" title="重命名分支" aria-label="重命名分支" hidden><i data-lucide="pencil"></i></button><button class="icon" id="delete-branch" title="删除分支" aria-label="删除分支" hidden><i data-lucide="trash-2"></i></button><button class="icon" id="fork" title="从所选提问创建分支" aria-label="从所选提问创建分支" disabled><i data-lucide="git-fork"></i></button></div>
<div class="message-pane"><div id="messages" tabindex="0" aria-label="对话记录"><div class="empty"><i data-lucide="messages-square"></i><p>正在读取对话</p></div></div><button id="latest" type="button" title="回到最新输出" aria-label="回到最新输出" hidden><i data-lucide="arrow-down"></i><span id="latest-label" hidden>有新内容</span></button></div>
<form id="composer"><div class="compose-meta"><span id="destination">尚未选择提问</span><div class="model-picker" title="选择下一条提问使用的模型"><select id="model-select" aria-label="选择模型"><option value="gpt-6-astra">GPT-6 Astra</option><option value="gpt-5.6-sol">GPT-5.6 Sol</option><option value="gpt-5.6-terra">GPT-5.6 Terra</option><option value="gpt-5.6-luna">GPT-5.6 Luna</option></select></div></div><div id="quote-draft" hidden></div><textarea id="prompt" rows="3" aria-label="继续提问" placeholder="继续提问…" disabled></textarea><div class="compose-actions"><span id="run-state" role="status">就绪</span><button id="stop" type="button" class="icon" aria-label="停止回答" title="停止回答" hidden><i data-lucide="square"></i></button><button id="send" class="send" type="submit" title="发送提问" aria-label="发送提问" disabled><i data-lucide="arrow-up"></i></button></div></form>
</section>
</main>
<dialog id="name-dialog"><form method="dialog"><h2>重命名分支</h2><input id="name-input" maxlength="80" aria-label="分支名称" required><div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button value="save">保存</button></div></form></dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title"><form method="dialog"><h2 id="delete-title">删除分支</h2><p id="delete-summary"></p><ul id="delete-list"></ul><div class="dialog-actions"><button value="cancel" autofocus>取消</button><button value="delete" class="danger">删除</button></div></form></dialog>
<dialog id="history-dialog" aria-labelledby="history-title"><div class="dialog-head"><h2 id="history-title">切换对话</h2><button class="icon" id="close-history" title="关闭" aria-label="关闭对话列表"><i data-lucide="x"></i></button></div><div class="history-search search"><i data-lucide="search"></i><input id="history-search" type="search" placeholder="搜索历史对话" aria-label="搜索历史对话" autocomplete="off"></div><div class="history-toolbar"><span id="history-count"></span><label class="archived"><input id="archived" type="checkbox">显示已归档</label></div><div id="history-list" aria-label="历史对话"></div><div class="history-footer"><button id="history-new"><i data-lucide="square-pen"></i>新建对话</button></div></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-head"><h2 id="settings-title">外观设置</h2><button class="icon" id="close-settings" title="关闭" aria-label="关闭外观设置"><i data-lucide="x"></i></button></div><fieldset><legend>显示模式</legend><div class="theme-options"><label><input type="radio" name="theme" value="light"><span><i data-lucide="sun"></i>白天</span></label><label><input type="radio" name="theme" value="dark"><span><i data-lucide="moon"></i>黑夜</span></label><label><input type="radio" name="theme" value="system"><span><i data-lucide="monitor"></i>系统</span></label></div></fieldset><fieldset><legend>强调色 <span id="palette-name"></span></legend><div class="palette-options"><label title="松绿"><input type="radio" name="palette" value="green" aria-label="松绿"><span class="swatch green"><i data-lucide="check"></i></span></label><label title="湖蓝"><input type="radio" name="palette" value="blue" aria-label="湖蓝"><span class="swatch blue"><i data-lucide="check"></i></span></label><label title="玫红"><input type="radio" name="palette" value="rose" aria-label="玫红"><span class="swatch rose"><i data-lucide="check"></i></span></label><label title="琥珀"><input type="radio" name="palette" value="amber" aria-label="琥珀"><span class="swatch amber"><i data-lucide="check"></i></span></label><label title="石墨"><input type="radio" name="palette" value="graphite" aria-label="石墨"><span class="swatch graphite"><i data-lucide="check"></i></span></label></div></fieldset></dialog>
</body></html>
